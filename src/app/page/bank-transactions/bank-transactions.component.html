<div class="card flex flex-wrap justify-center gap-4">

  @for (mcc of mcc_list$ | async; track mcc) {
    <div class="flex items-center">
      <p-checkbox [inputId]="mcc.mcc" [value]="mcc" [(ngModel)]="mss_selected" (ngModelChange)="onSelect($event)"/>
      <label [for]="mcc.mcc" class="ml-2"> {{ mcc.shortDescription.uk }} </label>
    </div>
  }
</div>
<p-chart type="bar" [data]="data" [options]="options" class="h-[30rem]"/>
