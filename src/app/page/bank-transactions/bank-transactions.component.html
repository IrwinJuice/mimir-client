<div class="flex flex-col h-full">
  <div class="card flex flex-wrap justify-center gap-4">
    @for (mcc of mcc_list; track mcc) {
      <div class="flex items-center">
        <p-checkbox [inputId]="mcc.mcc" [value]="mcc" [(ngModel)]="mss_selected" (ngModelChange)="onSelect($event)"/>
        <label [for]="mcc.mcc" class="ml-2"> {{ mcc.shortDescription.uk }} </label>
      </div>
    }
  </div>
  <div class="card">
    <p-tabs value="0" >
      <p-tablist>
        <p-tab value="0">Графік</p-tab>
        <p-tab value="1">Таблиця</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="0">
          <ag-charts class="flex-1 block" style="height: 100%; min-height: calc(100vh - 400px)" [options]="options"></ag-charts>
        </p-tabpanel>
        <p-tabpanel value="1">

        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>
