<div class="card flex-col justify-end p-2 mb-4">
  <p-divider align="left" type="solid">
    <b>Користувач</b>
  </p-divider>

  <app-user></app-user>

  @let selectedUser$ = userService.selected_user$ | async;
  @if (selectedUser$) {
    <p-divider align="left" type="solid">
      <b>Банківські аккаунти</b>
    </p-divider>
    <app-account [user]="selectedUser$"></app-account>
  }
</div>
