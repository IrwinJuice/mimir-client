<p-menubar class="mb-4">
  <ng-template #start>
    <p-date-picker [(ngModel)]="range_dates" (ngModelChange)="onRangeChange()" selectionMode="range"
                   [readonlyInput]="true"/>
  </ng-template>
  <ng-template #end>
    <theme-switcher/>
  </ng-template>
</p-menubar>
<div class="flex p-0 gap-2 w-full">
  <div class="h-full w-2/3 overflow-auto">
    <router-outlet/>
  </div>
  <div class="h-full w-1/3 overflow-auto">
    <app-sidebar></app-sidebar>
  </div>
</div>
<p-toast/>
