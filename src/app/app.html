<p-menubar class="mb-4" [model]="items">
  <ng-template #start>
    <a class="logo" routerLink="/"><img src="../assets/icons/coins-48.png" alt="">Mimir analytics</a>
    <p-date-picker [(ngModel)]="range_dates" (ngModelChange)="on_range_change($event)" selectionMode="range"
                   [readonlyInput]="true"/>

  </ng-template>
  <ng-template #end>
    <theme-switcher/>
  </ng-template>
</p-menubar>
<div class="flex p-0 gap-2 w-full">
  <div class="h-full w-2/3 overflow-auto">
    <router-outlet/>
  </div>
  <div class="h-full w-1/3 overflow-auto">
    <app-sidebar></app-sidebar>
  </div>
</div>
<p-toast/>
