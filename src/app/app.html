<div>
  <div>
    <router-outlet/>
  </div>
  <div>
    <theme-switcher />

      <p-select [options]="users()" [(ngModel)]="selectedUser" [loading]="true" optionLabel="name"

      <p-button label="Add user" icon="pi pi-plus"/>
    }
  </div>
</div>
